[project]
name = "brain-tools"
version = "0.1.0"
description = "Recall, upkeep and an MCP server for a markdown second brain (Obsidian or any folder)."
requires-python = ">=3.10"
dependencies = []                      # the core (search, lint, memory, heartbeat) is standard library only

[project.optional-dependencies]
mcp = ["mcp>=2,<3", "pydantic>=2"]     # only needed for the MCP server
dev = ["pytest", "anyio", "mcp>=2,<3", "pydantic>=2"]

[project.scripts]
brain = "brain.cli:entry"
brain-mcp = "brain.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brain"]
