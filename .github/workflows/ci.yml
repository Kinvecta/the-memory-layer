name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install brain-tools
        working-directory: brain-tools
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        working-directory: brain-tools
        run: python -m pytest -q
      - name: Smoke test on the reference vault (keyword search, no Ollama)
        run: |
          brain --vault brain-vault index
          brain --vault brain-vault search "recall ladder"
          brain --vault brain-vault lint
